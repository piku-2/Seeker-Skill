[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"
[project]
name = "truth-seeker"
version = "1.3.0"
description = "Personal evidence-based history map and skill repair agent tooling"
requires-python = ">=3.10"
dependencies = [
    "reportlab>=3.6",
    "Pillow>=9",
    "pymupdf>=1.28.2",
]
[project.optional-dependencies]
test = ["pytest>=7"]
[project.scripts]
truth-seeker-tool = "truth_seeker.cli:main"
[tool.setuptools.packages.find]
include = ["truth_seeker*"]

[tool.setuptools.package-data]
truth_seeker = ["fonts/*.ttf", "fonts/*.txt", "explorer_ui/*.css", "explorer_ui/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
